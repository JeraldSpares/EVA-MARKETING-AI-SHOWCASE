name: Monthly Marketing Report (Last Day of Month, 8:00 AM PHT)

on:
  schedule:
    - cron: '0 0 28-31 * *'   # Runs 28th-31st at 00:00 UTC (8AM PHT) — script checks if today is last day
  workflow_dispatch:

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check if last day of month
        id: check_date
        run: |
          python - <<'EOF'
          import os, calendar
          from datetime import date
          today = date.today()
          last_day = calendar.monthrange(today.year, today.month)[1]
          is_last = "true" if today.day == last_day else "false"
          print(f"Today: {today} | Last day of month: {last_day} | Is last day: {is_last}")
          with open(os.environ.get("GITHUB_OUTPUT",""), "a") as f:
              f.write(f"is_last_day={is_last}\n")
          EOF

      - name: Run Monthly Report
        if: steps.check_date.outputs.is_last_day == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASS:     ${{ secrets.GMAIL_APP_PASS }}
          GITHUB_PAT:         ${{ secrets.GITHUB_PAT }}
          GITHUB_REPO:        ${{ secrets.GITHUB_REPO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monthly_report.py

      - name: Notify Telegram — failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'EOF'
          import os, requests
          token   = os.environ.get("TELEGRAM_BOT_TOKEN","")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID","")
          if token and chat_id:
              requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat_id, "text": "❌ Monthly Report failed. Check GitHub Actions."},
                  timeout=10,
              )
          EOF
